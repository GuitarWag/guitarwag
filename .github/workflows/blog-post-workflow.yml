name: Latest blog posts

on:
  schedule:
    # Refresh the blog list every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest posts from wagnersilva.eu
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://wagnersilva.eu/rss.xml"
          max_post_count: 5
          commit_message: "chore: update latest blog posts"
